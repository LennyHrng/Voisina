<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!--
    SÉCURITÉ — Content Security Policy
    Le navigateur refuse tout script, style ou requête qui ne vient pas
    d'une source listée ici. Cela bloque la grande majorité des attaques XSS
    (injection de code) : aucun script "inline" n'est autorisé.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://unpkg.com;
    style-src 'self' https://unpkg.com;
    img-src 'self' data: blob: https://wmts.geo.admin.ch https://tile.openstreetmap.org;
    font-src 'self';
    connect-src 'self' https://api3.geo.admin.ch;
    manifest-src 'self';
    worker-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Voisina — L’entraide locale en Suisse</title>
  <meta name="description" content="Voisina met en relation les habitants de Suisse qui souhaitent s’entraider : proposer ou demander un service, donner un objet, près de chez soi. Gratuit, sans publicité et respectueux de la vie privée.">
  <meta name="theme-color" content="#12372A" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1613" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- Application installée sur téléphone (Android et iPhone) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Voisina">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="Voisina">
  <meta name="format-detection" content="telephone=no">

  <!-- Partage sur les réseaux (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Voisina">
  <meta property="og:title" content="Voisina — L’entraide locale en Suisse">
  <meta property="og:description" content="Proposez ou demandez un coup de main près de chez vous, dans les 26 cantons.">
  <meta property="og:image" content="https://lennyhrng.github.io/Voisina/og-image.png">
  <meta property="og:url" content="https://lennyhrng.github.io/Voisina/">
  <meta property="og:locale" content="fr_CH">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preload" href="fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Carte : Leaflet (version figée + empreinte SRI = le fichier ne peut pas être modifié par un tiers) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css?v=2.4">

  <!-- Applique le thème (clair/sombre) avant l'affichage pour éviter un flash -->
  <script src="theme-boot.js?v=2.4"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-action="skip">Aller au contenu</a>

  <div id="demo-banner" class="demo-banner" hidden></div>
  <header id="site-header" class="site-header"></header>

  <main id="main" tabindex="-1">
    <noscript>
      <div class="container noscript">
        <h1>Voisina</h1>
        <p>Voisina a besoin de JavaScript pour fonctionner. Merci de l’activer dans votre navigateur.</p>
      </div>
    </noscript>
    <div id="view" class="view"></div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <nav id="tabbar" class="tabbar" aria-label="Navigation principale"></nav>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="voisina.js?v=2.4" defer></script>
</body>
</html>
